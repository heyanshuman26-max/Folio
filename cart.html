<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart — FOLIO</title>

<link rel="stylesheet" href="css/style.css">

<style>
.cart-container{
  padding-top:120px;
}
.cart-title{
  font-family:var(--serif);
  font-size:28px;
  margin-bottom:30px;
}
.summary{
  margin-top:40px;
  border-top:1px solid var(--border);
  padding-top:20px;
}
.summary h3{
  font-size:14px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--muted);
}
.total{
  font-size:28px;
  color:var(--accent);
  margin-top:10px;
}
.checkout{
  margin-top:20px;
  display:inline-block;
}
.empty-state{
  padding:24px 0;
  color:var(--muted);
  font-size:13px;
}
</style>
</head>

<body>

<nav>
<div class="container nav-inner">
<a href="home.html" class="logo">FOLIO<span>.</span></a>

<ul class="nav-links">
<li><a href="home.html">Home</a></li>
<li><a href="shop.html">Shop</a></li>
<li><a href="cart.html" class="active">Cart</a></li>
</ul>
</div>
</nav>

<div class="container cart-container">
  <div class="cart-title">
    Your Cart
    <span data-cart-count style="font-size:12px;color:var(--muted);margin-left:10px;"></span>
  </div>

  <div data-cart-empty class="empty-state" style="display:none;">
    Your cart is empty. Add some books from the shop.
  </div>

  <div data-cart-items></div>

  <div class="summary">
    <h3>Total</h3>
    <div class="total" data-cart-total>$0.00</div>
    <a href="#" class="btn btn-solid checkout" aria-label="Checkout">Checkout</a>
  </div>
</div>

<script src="data/data.js"></script>
<script src="js/app.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
